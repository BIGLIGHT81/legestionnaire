<!doctype html>

<style>

@font-face{font-family:'NSA';src:url('fonts/NotoSansArabic-Bold.ttf');font-weight:700}
:root{--bg:#0f2a1f;--card:#ffffff;--ink:#14231c;--muted:#5b6b63;--green:#16a34a;--green2:#0e7a37;--line:#dbe5df;--err:#c62828}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'NSA',system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1f6b45 0,transparent 60%),var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.box{background:var(--card);border-radius:18px;max-width:420px;width:100%;padding:30px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.box img{width:76px;height:76px}
h1{font-size:22px;margin:10px 0 2px;direction:ltr}
h1 b{color:var(--green)}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
label{display:block;text-align:right;font-size:14px;font-weight:700;margin-bottom:6px}
input{width:100%;font:600 20px/1.2 ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;direction:ltr;padding:12px;border:2px solid var(--line);border-radius:12px;outline:none;text-transform:uppercase}
input:focus{border-color:var(--green)}
button{width:100%;margin-top:12px;font:700 17px 'NSA',sans-serif;padding:12px;border:0;border-radius:12px;background:var(--green);color:#fff;cursor:pointer}
button:hover{background:var(--green2)}button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--err)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:11px;border-radius:12px;border:2px solid #25d366;color:#128c4a;text-decoration:none;font-weight:700;font-size:15px}
.wa svg{width:20px;height:20px}
.foot{margin-top:16px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

  <label for="c">رمز الدخول</label>
  <input id="c" placeholder="LGV-XXXX-XXXX" spellcheck="false" autocapitalize="characters" required>

  <div class="msg" id="m"></div>

  <div class="foot" dir="ltr">+212 633 03 72 42</div>
</form>
<script>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function open(code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(META.s), iterations: META.n }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
